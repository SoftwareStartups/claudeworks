[project]
name = "claudeworks"
version = "0.1.0"
description = "Claude Code plugin marketplace for development workflows"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "packaging>=24",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "tomlkit>=0.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
extraPaths = ["plugins/python-tools/skills/update-deps", "plugins/adr/skills/adr"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/python-tools/skills/update-deps", "plugins/adr/skills/adr"]
